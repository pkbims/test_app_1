name: backend

on:
  push:
    branches: [main, backend]
    paths: ["backend/**", "contract/**", "docker-compose.yml", ".github/workflows/backend.yml"]
  pull_request:
    paths: ["backend/**", "contract/**", "docker-compose.yml", ".github/workflows/backend.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: app1
          POSTGRES_PASSWORD: app1
          POSTGRES_DB: app1
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U app1 -d app1"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql://app1:app1@localhost:5432/app1
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: lint
        run: |
          ruff check .
          ruff format --check .
      - name: types
        run: mypy
      - name: contract is unchanged
        run: python export_openapi.py && git diff --exit-code ../contract/openapi.json
      - name: tests (unit + integration)
        run: pytest -m "" --cov=app --cov=worker --cov-report=term-missing

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: build image
        run: docker build -t app1-backend:${{ github.sha }} backend
